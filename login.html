<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - ERP Uso e Consumo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #1a56db;
            --primary-hover: #1e40af;
            --bg-body: #f1f5f9;
            --bg-surface: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .login-container {
            background-color: var(--bg-surface);
            padding: 48px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background-color: var(--primary);
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 14px 0 rgba(26, 86, 219, 0.39);
        }

        .logo-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 20px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.2s ease;
            outline: none;
            background-color: #f8fafc;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
            background-color: #ffffff;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            background-color: #fef2f2;
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="ph ph-package"></i>
            </div>
            <div>
                <div class="logo-title">Uso & Consumo</div>
                <div class="logo-subtitle">Portal Corporativo</div>
            </div>
        </div>

        <div id="error-box" class="error-message">
            <i class="ph ph-warning-circle"></i> <span id="error-text">Usuário ou senha incorretos.</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Usuário</label>
                <div class="input-wrapper">
                    <i class="ph ph-user"></i>
                    <input type="text" id="username" placeholder="Digite seu usuário..." required
                        autocomplete="username">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 32px;">
                <label>Senha</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="password" placeholder="Digite sua senha..." required
                        autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                Entrar <i class="ph ph-arrow-right"></i>
            </button>
        </form>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('erp_user')) {
            window.location.href = 'index.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-submit');
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');

            // Reset UI
            errorBox.style.display = 'none';
            btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Autenticando...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save user to localStorage
                    localStorage.setItem('erp_user', JSON.stringify(data.user));

                    // Redirect to App
                    btn.innerHTML = '<i class="ph ph-check-circle"></i> Sucesso!';
                    btn.style.backgroundColor = '#10b981'; // green
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    // Show Error
                    errorText.innerText = data.error || 'Erro na autenticação.';
                    errorBox.style.display = 'block';
                    btn.innerHTML = 'Entrar <i class="ph ph-arrow-right"></i>';
                    btn.disabled = false;
                }
            } catch (err) {
                errorText.innerText = 'Servidor offline ou inacessível.';
                errorBox.style.display = 'block';
                btn.innerHTML = 'Entrar <i class="ph ph-arrow-right"></i>';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
